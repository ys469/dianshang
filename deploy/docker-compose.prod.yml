services:
  mysql:
    image: mysql:8.0
    container_name: dianshang-mysql
    restart: unless-stopped
    env_file:
      - ./env/mysql.env
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - dianshang-net

  redis:
    image: redis:7-alpine
    container_name: dianshang-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - dianshang-net

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: dianshang-api
    restart: unless-stopped
    env_file:
      - ./env/api.env
    depends_on:
      - mysql
      - redis
    networks:
      - dianshang-net

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.example.com}
    container_name: dianshang-admin
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - dianshang-net

  mobile:
    build:
      context: ..
      dockerfile: apps/mobile/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.example.com}
        VITE_ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL:-https://admin.huakaibuxie.online}
    container_name: dianshang-mobile
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - dianshang-net

  nginx:
    image: nginx:1.27-alpine
    container_name: dianshang-nginx
    restart: unless-stopped
    depends_on:
      - api
      - admin
      - mobile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/api.conf:/etc/nginx/conf.d/api.conf:ro
      - ./nginx/admin-proxy.conf:/etc/nginx/conf.d/admin-proxy.conf:ro
      - ./nginx/mobile-proxy.conf:/etc/nginx/conf.d/mobile-proxy.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - dianshang-net

volumes:
  mysql-data:
  redis-data:

networks:
  dianshang-net:
